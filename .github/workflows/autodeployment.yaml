name: Auto Deployment
"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Terminate the job if it takes longer than 5 minutes
    steps:
      - name: Stage 1 - Checkout code
        uses: actions/checkout@v7
        
      - name: Stage 2 - Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Stage 3 - Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Stage 4 - Run Pytest
        # Map the GitHub secret to the environment variable your Python code is looking for
        env: 
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: pytest

      - name: Stage 5 - Build Docker image
        run: |
            ls
            docker build -f DockerFile -t flaskappwithcicdpipeline:${{ github.sha }} .
            docker images

      # Prerequisite for ECR and EC2 Deployment
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }} # Updated to match your region
