name: Auto Deployment
"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Terminate the job if it takes longer than 5 minutes

    # Pass AWS credentials as environment variables across all steps in this job
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPO: ${{ secrets.AWS_ECR_REPO }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Stage 1 - Checkout code
        uses: actions/checkout@v7
        
      - name: Stage 2 - Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Stage 3 - Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Stage 4 - Run Pytest
        # Map the GitHub secret to the environment variable your Python code is looking for
        env: 
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: pytest

      - name: Stage 5 - Build Docker image
        run: |
            ls
            docker build -f DockerFile -t ${{ env.ECR_REPO }}:${{ github.sha }} .
            docker images
            
      # Prerequisite for ECR and EC2 Deployment
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }} # Updated to match your region
      
      - name: Stage 6 - Push to ECR
        run: |
            # Authenticate Docker to the Amazon ECR registry
            aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com
            
            # Tag the Docker image with the ECR repository URI and the GitHub SHA
            docker tag ${{ env.ECR_REPO }}:${{ github.sha }} ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ github.sha }}
            
            # Push the Docker image to Amazon ECR
            docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ github.sha }}
          
      # 7. Deploy to EC2 (Using native OpenSSH)
      - name: Stage 7 - Deploy to EC2
        run: |
          # 1. Configure SSH private key and permissions
          echo "Stage 7.10"
          mkdir -p ~/.ssh
          echo "${{ env.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Stage 7.11"
          
          # 2. Set registry endpoint
          echo "Stage 7.20"
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          echo "Stage 7.21"

          # 3. Execute remote commands on EC2 via SSH
          echo "Stage 7.30"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${EC2_USERNAME}@${EC2_HOST} << EOF
            # Authenticate Docker on the EC2 instance
            aws ecr get-login-password --region $AWS_DEFAULT_REGION | sudo docker login --username AWS --password-stdin $REGISTRY
          echo "Stage 7.31"
            
            # Pull the new image
            sudo docker pull $REGISTRY/$ECR_REPO:${{ github.sha }}
            echo "Stage 7.32"
            # Stop and remove existing container if running
            sudo docker stop ${ECR_REPO} || true
            sudo docker rm ${ECR_REPO} || true
            echo "Stage 7.33"
            
            # Run the new container
            sudo docker run -d --name ${ECR_REPO} -p 5000:5000 \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              $REGISTRY/$ECR_REPO:${{ github.sha }}
            echo "Stage 7.4"
          EOF

      # 8. Verify /health Endpoint (Using native cURL)
      - name: Stage 8 - Verify /health endpoint
        run: |
          echo "Polling /health endpoint..."
          for i in {1..5}; do
            if curl -s -f http://${{ env.EC2_HOST }}/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for service to become healthy..."
            sleep 10
          done
          echo "Health check failed."
          exit 1
